base = "plain_needs"

[[rulesets]]
[rulesets.rules]
"Overall, {lower_subject} is untroubled by unmet needs." = "总体而言，{lower_subject}没有受到未满足需求的困扰。"
"{subject} is unfettered {reason}." = "{subject}没有因为{reason}而感到受束缚。"
"{subject} is level-headed {reason}." = "{subject}没有因为{reason}而失去冷静。"
"{subject} is untroubled {reason}." = "{subject}没有因为{reason}而感到困扰。"
"{subject} is not distracted {reason}." = "{subject}没有因为{reason}而分心。"
"{subject} is unfocused {reason}." = "{subject}因为{reason}而有些心不在焉。"
"{subject} is distracted {reason}." = "{subject}因为{reason}而难以专注。"
"{subject} is badly distracted {reason}." = "{subject}因为{reason}而严重分心。"

[[rulesets]]
name = "subject"
[rulesets.rules]
"He" = "他"
"She" = "她"

